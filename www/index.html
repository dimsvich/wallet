<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenLocal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #4caf50; text-align: center; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: white;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            background: #4caf50;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        button:active { background: #388e3c; }
        .status { text-align: center; margin-top: 15px; font-size: 14px; }
        .tx-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tx-info { display: flex; flex-direction: column; }
        .tx-desc { font-weight: bold; font-size: 15px; }
        .tx-date { font-size: 12px; color: #888; margin-top: 4px; }
        .tx-amount { font-weight: bold; font-size: 16px; }
        .green { color: #4caf50; } /* Доход */
        .white { color: #ffffff; } /* Расход */
    </style>
</head>
<body>
    <h2>ZenLocal</h2>
    
    <input type="text" id="monoToken" placeholder="Вставь токен Монобанка">
    <button id="syncBtn">Синхронизировать Монобанк</button>
    
    <div id="status" class="status"></div>
    <div id="transactions"></div>

    <script src="js/app.js"></script>
</body>
</html>
