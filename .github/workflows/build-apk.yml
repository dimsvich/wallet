name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # Подключает плагины (в т.ч. Google-вход) к Android-проекту
      - name: Capacitor sync
        run: npx cap sync android

      # Постоянный ключ подписи: SHA-1 не меняется между сборками
      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore || { echo "::error::debug.keystore не найден в корне репозитория. Выполните: git add -f debug.keystore"; exit 1; }
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      # Явно задаём подпись debug-сборки: берём debug.keystore из корня репозитория
      - name: Force fixed signing in Gradle
        run: |
          test -f android/app/build.gradle || { echo "::error::android/app/build.gradle не найден (возможно, он .kts)"; exit 1; }
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Диагностика подписи (не блокирует сборку)
      - name: Show APK signature
        continue-on-error: true
        run: |
          echo "Ожидаемый SHA-1: 47fe11040d59d0c2e3cf1fa8a3ee2f68faa673ec"
          echo "--- SHA-1 из debug.keystore в репозитории:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep SHA1
          echo "--- SHA-1, которым подписан собранный APK:"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1"

      - uses: actions/upload-artifact@v4
        with:
          name: ZenLocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
