name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # Подключает плагины (в т.ч. Google-вход) к Android-проекту
      - name: Capacitor sync
        run: npx cap sync android

      # Постоянный ключ подписи: SHA-1 не меняется между сборками
      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore || { echo "::error::debug.keystore не найден в корне репозитория. Выполните: git add -f debug.keystore"; exit 1; }
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Должно быть: 47:FE:11:04:0D:59:D0:C2:E3:CF:1F:A8:A3:EE:2F:68:FA:A6:73:EC
      - name: Show APK signature
        run: |
          echo "Ожидаемый SHA1: 47:FE:11:04:0D:59:D0:C2:E3:CF:1F:A8:A3:EE:2F:68:FA:A6:73:EC"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA1"

      - uses: actions/upload-artifact@v4
        with:
          name: ZenLocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
