<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenLocal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* Отступ для нижней панели */
        }
        
        /* Шапка с балансом */
        .header {
            padding: 20px;
            background: #181818;
            border-bottom: 1px solid #222;
        }
        .balance-title { font-size: 13px; color: #888; }
        .balance-amount { font-size: 26px; font-weight: bold; margin-top: 5px; }

        .container { padding: 15px; }

        /* Секции */
        .section-header {
            font-size: 14px;
            color: #888;
            margin: 20px 0 10px 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Карточки счетов */
        .account-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .account-info { display: flex; flex-direction: column; }
        .account-name { font-weight: bold; font-size: 15px; }
        .account-sub { font-size: 12px; color: #888; margin-top: 3px; }
        .account-sum { font-weight: bold; font-size: 16px; }

        /* Формы и кнопки */
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #4caf50;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-mono { background: #ff5722; }

        /* Транзакции */
        .tx-card {
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tx-info { display: flex; flex-direction: column; width: 70%; }
        .tx-desc { font-weight: bold; font-size: 14px; }
        .tx-date { font-size: 11px; color: #888; margin-top: 3px; }
        .tx-amount { font-weight: bold; font-size: 15px; }
        .green { color: #4caf50; }
        .white { color: #ffffff; }

        /* Нижняя панель навигации */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #181818;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }
        .nav-item {
            background: none;
            border: none;
            color: #777;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 20%;
            padding: 0;
            margin: 0;
        }
        .nav-item.active { color: #4caf50; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }

        /* Управление вкладками */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <div class="balance-title">Общий баланс</div>
        <div class="balance-amount" id="totalBalance">0 ₴</div>
    </div>

    <!-- ВКЛАДКА 1: СЧЕТА -->
    <div id="tab-accounts" class="tab-content active container">
        <div class="section-header">Банки и счета</div>
        
        <div class="account-card">
            <div class="account-info">
                <span class="account-name">💳 Monobank</span>
                <span class="account-sub" id="monoSub">Токен не подключен</span>
            </div>
            <div class="account-sum" id="monoBalance">0 ₴</div>
        </div>

        <div class="account-card">
            <div class="account-info">
                <span class="account-name">💵 Наличные / Ручной учет</span>
                <span class="account-sub">Все внебиржевые расходы</span>
            </div>
            <div class="account-sum" id="manualBalance">0 ₴</div>
        </div>

        <div class="section-header">Настройки интеграции</div>
        <div class="account-card" style="flex-direction: column; align-items: stretch;">
            <div style="font-weight: bold; margin-bottom: 8px; color: #ff5722;">Подключение Monobank</div>
            <input type="text" id="monoToken" placeholder="Вставьте X-Token">
            <button id="syncMonoBtn" class="btn-mono">Синхронизировать Mono</button>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ОПЕРАЦИИ -->
    <div id="tab-operations" class="tab-content container">
        <div class="section-header">Добавить операцию вручную</div>
        <div class="account-card" style="flex-direction: column; align-items: stretch; margin-bottom: 20px;">
            <input type="number" id="manualAmount" placeholder="Сумма (например, -150 или 500)">
            <input type="text" id="manualDesc" placeholder="Описание (Продукты, Кафе...)">
            <select id="manualType">
                <option value="expense">Расход</option>
                <option value="income">Доход</option>
            </select>
            <button id="addManualBtn">Сохранить операцию</button>
        </div>

        <div class="section-header">История операций</div>
        <div id="status" style="font-size: 13px; color: #888; margin-bottom: 10px;"></div>
        <div id="transactions"></div>
    </div>

    <!-- ВКЛАДКА 3: АНАЛИТИКА (Задел на будущее) -->
    <div id="tab-analytics" class="tab-content container">
        <div class="section-header">Аналитика расходов</div>
        <p style="color: #888; font-size: 14px;">Здесь появятся графики по категориям (MCC-кодам), как в Дзен-мани.</p>
    </div>

    <!-- Нижняя панель навигации (как на скриншоте) -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('accounts', this)">
            <span class="nav-icon">📊</span> Счета
        </button>
        <button class="nav-item" onclick="switchTab('operations', this)">
            <span class="nav-icon">📑</span> Операции
        </button>
        <button class="nav-item" onclick="switchTab('analytics', this)">
            <span class="nav-icon">📈</span> Аналитика
        </button>
    </nav>

    <script src="js/app.js"></script>
    <script>
        // Функция переключения вкладок внизу
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
