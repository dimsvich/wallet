name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # Подключает плагины (в т.ч. Google-вход) к Android-проекту
      - name: Capacitor sync
        run: npx cap sync android

      # Постоянный ключ подписи: SHA-1 не меняется между сборками,
      # поэтому Google-вход продолжает работать
      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZenLocal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
